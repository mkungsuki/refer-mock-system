/* ---------- ข้อมูลวิเคราะห์ย้อนหลัง 12 สัปดาห์ ---------- */
function cntBy(arr, key){ const m={}; for(const a of arr){ const k=key(a); if(!k) continue; m[k]=(m[k]||0)+1; } return Object.entries(m).sort((x,y)=>y[1]-x[1]); }
function analyticsData(){
  const from = d2s(addDays(s2d(TODAY), -84));
  const past = state.appts.filter(a => a.date>=from && a.date<TODAY && a.status!=='cancelled');
  const refs = past.filter(a=>a.type==='refer');
  const done = past.filter(a=>a.status==='done').length;
  const ns = past.filter(a=>a.status==='noshow').length;
  const leadOf = a => Math.max(0, Math.round((s2d(a.date)-s2d(a.createdOn||a.date))/86400000));
  const depts = [...new Set(state.targets.map(t=>t.dept))];
  const nsDept = depts.map(d=>{
    const ids = state.targets.filter(t=>t.dept===d).map(t=>t.id);
    const p = past.filter(a=>ids.includes(a.targetId));
    const n = p.filter(a=>a.status==='noshow').length;
    return [d, p.length? Math.round(n/p.length*100):0, p.length];
  }).sort((x,y)=>y[1]-x[1]);
  const buckets = [['นัดล่วงหน้า < 2 สัปดาห์',0,13],['2 สัปดาห์ – 2 เดือน',14,60],['เกิน 2 เดือน',61,99999]];
  const nsLead = buckets.map(([l,lo,hi])=>{
    const p = past.filter(a=>{ const ld=leadOf(a); return ld>=lo && ld<=hi; });
    const n = p.filter(a=>a.status==='noshow').length;
    return [l, p.length? Math.round(n/p.length*100):0, p.length];
  });
  const urg = past.filter(a=>a.urgent);
  const urgTop = cntBy(urg, a=>{ const t=T(a.targetId); return t?t.name:null; })[0];
  return {
    total: past.length, refs, past,
    urgCount: urg.length, urgTop,
    nsRate: (done+ns) ? Math.round(ns/(done+ns)*100) : 0,
    avgLead: past.length ? Math.round(past.reduce((s,a)=>s+leadOf(a),0)/past.length) : 0,
    topIcd: cntBy(refs, a=>a.icd),
    byHosp: cntBy(refs, a=>a.from),
    nsDept, nsLead,
    perDoc: state.targets.map(t=>{
      const p = past.filter(a=>a.targetId===t.id);
      return {t, top: cntBy(p, a=>a.icd).slice(0,3), n: p.length};
    }).filter(x=>x.n>0).sort((x,y)=>y.n-x.n)
  };
}

/* panel เดียวต่อครั้ง (progressive disclosure) — top 5 ก่อน กด "ดูทั้งหมด" ค่อยกาง */
function dashPanelHTML(A){
  const hbar = (rows, labelFn, valueFn, maxHint, suffix, colorFn) => {
    const max = maxHint || Math.max(...rows.map(valueFn), 1);
    return rows.map(r=>{
      const v = valueFn(r);
      return `<div class="hrow"><span class="lb">${labelFn(r)}</span>
        <div class="tr"><i class="${colorFn?colorFn(r):''}" style="width:${Math.round(v/max*100)}%"></i></div>
        <span class="n">${v}${suffix||''}</span></div>`;
    }).join('');
  };
  const more = (rows) => rows.length>5 && !dashMore
    ? `<button class="morebtn" onclick="togDashMore()">▾ ดูทั้งหมด ${rows.length} รายการ</button>`
    : (rows.length>5 ? `<button class="morebtn" onclick="togDashMore()">▴ ย่อ</button>` : '');
  const cut = (rows) => dashMore ? rows : rows.slice(0,5);

  if (dashSec==='icd'){
    // เลือกดูรวมทั้ง รพ. หรือเจาะรายแผนก (แผนกของช่องที่ถูก refer เข้า)
    const depts = [...new Set(A.refs.map(a=>{ const t=T(a.targetId); return t?t.dept:null; }).filter(Boolean))].sort();
    const refsF = dashIcdDept==='all' ? A.refs : A.refs.filter(a=>{ const t=T(a.targetId); return t && t.dept===dashIcdDept; });
    const top = cntBy(refsF, a=>a.icd);
    return `<div class="row"><b>โรคที่ถูก refer มากที่สุด</b>
        <div class="seg sm">
          <button class="${dashIcdDept==='all'?'on':''}" onclick="setDashIcdDept('all')">รวมทั้ง รพ.</button>
          ${depts.map(d=>`<button class="${dashIcdDept===d?'on':''}" onclick="setDashIcdDept('${d}')">${d}</button>`).join('')}
        </div>
        <span class="muted">${dashIcdDept==='all'?`${A.refs.length} เคส`:`${refsF.length} เคสเข้า ${dashIcdDept}`}</span></div>
      ${top.length ? hbar(cut(top), r=>`${r[0]} ${ICD_NAME[r[0]]||''}`, r=>r[1])+more(top) : '<p class="muted mt">ไม่มีเคส refer เข้าแผนกนี้ในช่วง 12 สัปดาห์</p>'}
      ${top.length ? `<div class="insight">💡 ${dashIcdDept==='all'?'ทั้ง รพ.':dashIcdDept} 3 อันดับแรก: ${top.slice(0,3).map(r=>`${ICD_NAME[r[0]]||r[0]} (${r[1]})`).join(', ')} — ใช้ตัดสินใจเปิดคลินิกเฉพาะ/ขยายโควตา refer ของ service ที่ถูกขอบ่อย</div>`:''}`;
  }
  if (dashSec==='hosp'){
    const max = A.byHosp.length ? A.byHosp[0][1] : 1;
    return `<b>Refer แยกตาม รพ. ต้นทาง</b> <span class="muted">— กดชื่อ รพ. เพื่อดูโรคที่ส่งมา</span>
      ${A.byHosp.map(([h,n])=>{
        const open = dashHosp===h;
        let detail='';
        if (open){
          const topH = cntBy(A.refs.filter(a=>a.from===h), a=>a.icd).slice(0,5);
          detail = `<div style="margin:2px 0 10px 200px">${
            topH.map(([c,k])=>`<span class="chip icd" style="margin:2px">${c} ${ICD_NAME[c]||''} ×${k}</span>`).join(' ')
            || '<span class="muted">ไม่มีข้อมูลโรค</span>'}</div>`;
        }
        return `<div class="hrow" style="cursor:pointer" onclick="togHosp('${h}')">
          <span class="lb">${open?'▾':'▸'} ${h}</span>
          <div class="tr"><i style="width:${Math.round(n/max*100)}%"></i></div>
          <span class="n">${n}</span></div>${detail}`;
      }).join('')}
      <div class="insight">💡 ส่งมากสุด: ${A.byHosp.length?A.byHosp[0][0]+' ('+A.byHosp[0][1]+' เคส)':'—'} — ใช้คุยโควตา/พัฒนา service รายอำเภอ</div>`;
  }
  if (dashSec==='noshow'){
    const ratio = A.nsLead[0][1] ? (A.nsLead[2][1]/A.nsLead[0][1]).toFixed(1) : '-';
    return `<b>ไม่มาตามนัด (no-show) ตามระยะนัดล่วงหน้า</b>
      ${hbar(A.nsLead, r=>r[0], r=>r[1], 30, '%', r=>r[1]>=15?'red':r[1]>=10?'amber':'')}
      <div class="insight warn">💡 นัดเกิน 2 เดือน no-show ${A.nsLead[2][1]}% (${ratio} เท่าของนัดใกล้) → เป้าโครงการ: ระบบโทร/SMS เตือนเฉพาะกลุ่มนัดไกล</div>
      <div class="mt"><b>ตามแผนก</b></div>
      ${hbar(cut(A.nsDept), r=>`${r[0]}`, r=>r[1], 30, '%', r=>r[1]>=15?'red':r[1]>=10?'amber':'')}${more(A.nsDept)}`;
  }
  // who
  const rows = A.perDoc;
  return `<b>ใครเจออะไร — โรค 3 อันดับแรกของแต่ละหมอ/ช่องรับนัด</b>
    ${cut(rows).map(x=>`<div class="hrow"><span class="lb">${x.t.name}</span>
      <span style="flex:1; font-size:13px">${x.top.map(([c,n])=>`<span class="chip icd">${c} ${ICD_NAME[c]||''} ×${n}</span>`).join(' ')}</span>
      <span class="n muted">${x.n.toLocaleString()}</span></div>`).join('')}${more(rows)}
    <div class="insight">💡 ใช้ดู case-mix จริงของแต่ละคน — วางแผนอัตรากำลัง/ความเชี่ยวชาญที่ควรเสริม</div>`;
}

    <div class="row">

    ${totalRef>8 ? `<div class="row" style="margin-bottom:6px">

          </div>
          <div class="acts">
            <button class="sbtn" title="พิมพ์ใบนัดให้ผู้ป่วยถือมา" onclick="printSlip(${a.id})">🖨 ใบนัด</button>
            <button class="sbtn red" onclick="netCancel(${a.id})">ยกเลิก</button>
          </div></div>`).join('')
      : '<p class="muted mt">ยังไม่มีนัด</p>'}
    </div>`;
  if (netQ){ const inp=document.querySelector('#app input'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
}

function renderNetTarget(tid){
  const t = T(tid);
  document.getElementById('app').innerHTML = `
    <div class="crumb"><a onclick="netGoDepts()">บริการที่รับ refer</a><span class="sep">›</span>
      <b>${t.name}</b> <span class="chip kind">${t.dept}</span>
      <span class="muted">โควตา refer ${t.capR}/ครึ่งวัน · จาก ${netHosp}</span></div>
    ${ivPanelHTML(tid, 'r', cd=>`netBook('${tid}','${cd.ds}','${cd.sess}')`)}
    <div class="cal-head mt">
      <button class="navbtn" onclick="netCalMove(-1)">←</button>
      <select class="navbtn" onchange="calJump(this.value)" style="font-weight:700; font-size:15px">${monthOptionsHTML(cal.y, cal.m)}</select>
      <button class="navbtn" onclick="netCalMove(1)">→</button>
    </div>
    ${miniCalHTML(t, 'r', cal.y, cal.m, (ds,sess)=>`netBook('${tid}','${ds}','${sess}')`)}
    <p class="muted mt">กดช่อง "ว่าง" เพื่อจองสลอต refer · ตัวเลข = จำนวนที่ยังจองได้</p>`;
}

function netBook(tid, date, sess){
  const t = T(tid);
  openModal(`
    <button class="mclose" onclick="closeModal()">✕</button>
    <h2>จองสลอต refer — ${t.name}</h2>
    <p class="muted">${fmtShort(date)} (${SESS_TH[sess]}) · จาก ${netHosp}</p>
    <label class="f">ชื่อ-สกุลผู้ป่วย <input id="nPname" placeholder="เช่น นายสมหมาย ใจดี"></label>
    <label class="f">เลขบัตรประชาชน (CID) — ตัวระบุข้าม รพ. <input id="nCid" maxlength="13" placeholder="13 หลัก · รพ.ชุมแพ ใช้ match แล้วออก HN เอง"></label>
    <label class="f">เลข refer / ThaiRefer (ถ้ามี) <input id="nRef" placeholder="เช่น TR-680831-012"></label>
    ${purposeSelHTML('nPurpose','nWuPaint()')}
    ${icdFieldHTML('nIcd')}
    <div id="nWu"></div>
    ${xfFormHTML(t,'nx-')}
    <label class="f">เหตุผลส่งตัว / สิ่งที่ขอ <input id="nNote" placeholder="เช่น ขอ echo ประเมิน EF / สงสัย CA"></label>
    <div class="row mt"><button class="hbtn" style="background:var(--teal);color:#fff" onclick="netSave('${tid}','${date}','${sess}')">✔ ยืนยันจอง</button></div>
  `);
  window.nWuPaint = () => {
    document.getElementById('nWu').innerHTML =
      wuRender('nWu', t, icdRead('nIcd'), document.getElementById('nPurpose').value);
  };
  _icdWatch['nIcd'] = () => nWuPaint();
  _icdWuT['nIcd'] = t;
}
function netSave(tid, date, sess){
  const t = T(tid);
  const c = counts(tid, date, sess);
  if (c.r >= t.capR){ toast('สลอตเพิ่งเต็ม — เลือกวันอื่น'); closeModal(); render(); return; }
  const pname = document.getElementById('nPname').value.trim();
  const cid = document.getElementById('nCid').value.trim();
  if (!pname && !cid){ toast('ใส่ชื่อหรือ CID อย่างน้อย 1 อย่าง'); return; }
  const refNo = document.getElementById('nRef').value.trim();
  const note = document.getElementById('nNote').value.trim();
  // รพช. ไม่รู้ HN ชุมแพ — เก็บ CID/ชื่อ/เลข refer ไว้ ฝั่งชุมแพ match แล้วออก HN ตอนลงทะเบียน
  const nIcdCode = icdRead('nIcd');
  const nPurpose = document.getElementById('nPurpose').value;
  state.appts.push(Object.assign({id:state.nextId++, hn:null, pname, cid, refNo, targetId:tid, date, session:sess, type:'refer', note, from:netHosp,
    refPurpose: nPurpose, icd: nIcdCode, createdOn: TODAY, status: 'booked', extra: xfRead(t,'nx-')},
    wuCapture('nWu', t, nIcdCode, nPurpose)));
  if (iv) iv.cands = candidateSlots(t, 'r', iv.target);
  save(); closeModal(); render();
  toast(`จองสำเร็จ — ${t.name} ${fmtShort(date)} (${SESS_TH[sess]})`);
}
function netCancel(id){
  const a = state.appts.find(x=>x.id===id); if(!a) return;
  if (!confirm('ยกเลิกนัด refer นี้?')) return;
  a.status = 'cancelled'; a.cancelledBy = netHosp; a.cancelledOn = TODAY;
  save(); render(); toast('ยกเลิกแล้ว — สลอตคืนเป็นว่าง (ประวัติเก็บไว้)');
}

function togHosp(h){ dashHosp = dashHosp===h ? null : h; render(); }

/* ---------- start ---------- */
load();
/* login ค้างไว้ → เข้าหน้าแรกของบัญชีนั้นเลย (หน้าปัก > หน้า default ตามบทบาท) */
const savedUser = lsGetK(USER_KEY);
if (savedUser && USERS.some(u=>u.id===savedUser)) enterAs(savedUser, true);
else renderLogin();
</script>
</body>
